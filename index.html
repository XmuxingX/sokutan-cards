function say(t){if(!t||!window.speechSynthesis)return;if(!EV)pickV();if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=1;if(EV)u.voice=EV;speechSynthesis.speak(u)}
spk.addEventListener('click',e=>{e.stopPropagation();if(cur)say(cur.w)});
spk.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
let unlocked=false;document.addEventListener('touchend',()=>{if(!unlocked){unlocked=true;if(cur)say(cur.w)}},{once:true});
build();
// ===== 確認テスト（記録は sokutan_test_v1 のみ。sokutan_v1 には一切触れない） =====
var TM=false;const TK='sokutan_test_v1';let TS=JSON.parse(localStorage.getItem(TK)||'{}');TS.prog=TS.prog||{};TS.results=TS.results||[];
function tSave(){localStorage.setItem(TK,JSON.stringify(TS))}
function ymd(d){const p=v=>String(v).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
// 固定シード(20261027)の mulberry32 でカテゴリごとにシャッフルし、4グループへ順番に配る（どの端末でも同じ分け方）
const TG=(()=>{let a=20261027;const r=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const sh=v=>{for(let i=v.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[v[i],v[j]]=[v[j],v[i]]}return v};
 const G=[[],[],[],[]];let k=0;cats.slice(1).forEach(c=>sh(W.filter(x=>x.cat===c).sort((a,b)=>a.n-b.n)).forEach(x=>G[k++%4].push(x.n)));return G.map(sh)})();
const WN={};W.forEach(x=>WN[x.n]=x);
const tesc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
// 例文中の見出し語を太字＋下線（大文字小文字無視・語尾変化は語幹＋任意の語尾で簡易対応）
function thl(ex,w){const st=w.length>3&&/[ey]$/i.test(w)?w.slice(0,-1):w;const e=st.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
 const re=new RegExp('\\b('+e+(/y$/i.test(w)&&st!==w?'(?:y|i)':'')+'[a-z]*)','i');const m=ex.match(re);if(!m)return tesc(ex);
 return tesc(ex.slice(0,m.index))+'<b>'+tesc(m[0])+'</b>'+tesc(ex.slice(m.index+m[0].length))}
// 苦手テスト：スコア＝sokutan_v1 の ng ＋ 確認テスト（苦手テスト含む）で「わからない」になった回数（完了分＋途中分）
function tScore(){const c={};W.forEach(x=>{const g=S[x.n]?.ng||0;if(g>0)c[x.n]=g});const add=a=>(a||[]).forEach(n=>{if(WN[n])c[n]=(c[n]||0)+1});
 TS.results.forEach(r=>add(r.unknown));Object.values(TS.prog).forEach(P=>{if(!P.done)add(P.unknown)});return c}
function tWList(){const c=tScore();return Object.keys(c).map(Number).sort((a,b)=>c[b]-c[a]||a-b)}
function tWUpd(){optW.textContent=`苦手テスト（${tWList().length}語）`}
const tWSh=v=>{v=v.slice();for(let i=v.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]]}return v};
// 第r回＝凍結した対象リストの (r-1)*20+1〜r*20 位を回ごとにシャッフル
function tWNew(list,r){tNew('w',tWSh(list.slice((r-1)*20,r*20)),false,{list,r})}
function tL(P){return P.t==='w'?`苦手テスト第${P.r}回`:`テスト${P.t}`}
function tNew(t,order,retry,ex){TS.prog[t]=Object.assign({t:t==='w'?'w':+t,date:ymd(new Date()),order,i:0,known:[],unknown:[],retry:!!retry,done:false},ex);tSave()}
function tP(){const t=TS.sel||'1';if(!TS.prog[t]){if(t==='w')tWNew(tWList(),1);else tNew(t,TG[t-1].slice())}return TS.prog[t]}
function tShowCard(on){card.style.display=on?'':'none';swipehint.style.display=on?'':'none';tend.style.display=on?'none':'block';document.body.style.paddingBottom=on?'':'40px'}
function tNext(){tWUpd();const P=tP();if(P.t==='w'&&!P.list.length){delete TS.prog.w;tSave();cur=null;stat.textContent='苦手テスト';fill.style.width='0%';tShowCard(false);tend.innerHTML='<p style="text-align:center;color:#999;margin:24px 0">まだ苦手な単語はありません</p>';return}shown=false;back.style.display='none';hint.style.display='block';
 const N=P.order.length;stat.textContent=`${tL(P)}${P.retry?'（再）':''}　${Math.min(P.i,N)} / ${N}　わかった ${P.known.length}`;fill.style.width=(N?100*P.i/N:0)+'%';
 if(P.i>=N){cur=null;if(!P.done){P.done=true;P.end=ymd(new Date());TS.results.push(Object.assign({t:P.t,date:P.end,ok:P.known.length,total:N,unknown:P.unknown.slice(),retry:P.retry},P.t==='w'?{r:P.r}:{}));tSave();tWUpd()}return tEnd(P)}
 tShowCard(true);cur=WN[P.order[P.i]];num.textContent=tL(P)+'　'+(P.i+1)+' / '+N+(P.t==='w'?'　ミス'+(tScore()[cur.n]||0):'');word.textContent=cur.w;tex.innerHTML=thl(cur.ex||'',cur.w);tex.style.display=cur.ex?'':'none';say(cur.w);
 ja.textContent=cur.ja;zh.textContent='〔中〕'+cur.zh;note.textContent='※ '+cur.note;zh.style.display=cur.zh?'':'none';note.style.display=cur.note?'':'none';ex.style.display='none'}
function tMark(good){if(!cur)return;const P=tP();(good?P.known:P.unknown).push(cur.n);P.i++;tSave();tNext()}
function tEnd(P){tShowCard(false);const u=P.unknown.map(n=>WN[n]);
 tend.innerHTML=`<div style="text-align:center;font-size:28px;font-weight:700;margin:12px 0">正答 ${P.known.length}／${P.order.length}</div>`+
 (u.length?'<table style="width:100%;border-collapse:collapse">'+u.map(x=>'<tr style="border-bottom:1px solid #eee"><td style="padding:6px"><b>'+tesc(x.w)+'</b>　<small>'+tesc(x.ja)+'</small><br><small style="color:#555;font-style:italic">'+thl(x.ex||'',x.w)+'</small></td></tr>').join('')+'</table>':'<p style="text-align:center;color:#999">わからなかった単語はありません</p>')+
 '<p style="text-align:center;margin-top:16px">'+(u.length?'<button id="tretry" style="padding:8px 16px;border-radius:8px;border:1px solid #ccc;background:#fff">わからなかった単語だけもう一度</button> ':'')+(P.t==='w'&&P.list.length>P.r*20?'<button id="tnext20" style="padding:8px 16px;border-radius:8px;border:1px solid #ccc;background:#fff">次の20語</button> ':'')+'<button id="tagain" style="padding:8px 16px;border-radius:8px;border:1px solid #ccc;background:#fff">最初からやり直す</button></p>';
 const W2=P.t==='w'?{list:P.list,r:P.r}:undefined;if(u.length)tretry.onclick=()=>{tNew(P.t,P.unknown.slice(),true,W2);next()};
 if(window.tnext20)tnext20.onclick=()=>{tWNew(P.list,P.r+1);next()};tagain.onclick=()=>{if(P.t==='w')tWNew(tWList(),1);else tNew(P.t,TG[P.t-1].slice());next()}}
let cardCur=null;
function setMode(t){if(t===TM)return;if(t&&misslist.style.display==='block')miss.onclick();TM=t;TS.mode=t?'test':'card';tSave();
 document.body.classList.toggle('tmode',t);mC.classList.toggle('on',!t);mT.classList.toggle('on',t);tsel.style.display=t?'':'none';sel.style.display=t?'none':'';miss.style.display=t?'none':'';tex.style.display='none';
 if(t){cardCur=cur;tsel.value=TS.sel||'1';next()}else{tShowCard(true);tend.style.display='none';[zh,ex,note].forEach(e=>e.style.display='');if(cardCur)queue.unshift(cardCur);cardCur=null;next()}}
mC.onclick=()=>setMode(false);mT.onclick=()=>setMode(true);tsel.onchange=()=>{TS.sel=tsel.value;tSave();next()};
// コピー用：テスト結果の行
function tCopyLines(){const T=JSON.parse(localStorage.getItem('sokutan_test_v1')||'{}'),L=[];const f=n=>String(n).padStart(4,'0')+' '+(W.find(x=>x.n===n)||{w:'?'}).w;
 (T.results||[]).forEach(r=>L.push(`${tL(r)}${r.retry?'(再)':''} ${r.date} 正答${r.ok}/${r.total} わからない:${r.unknown.map(f).join(', ')||'なし'}`));
 Object.values(T.prog||{}).filter(P=>!P.done).forEach(P=>L.push(`${tL(P)}${P.retry?'(再)':''} 途中 ${P.date}開始 回答${P.i}/${P.order.length} わかった${P.known.length}`));return L}
tWUpd();if(TS.mode==='test')setMode(true);
</script></body></html>
